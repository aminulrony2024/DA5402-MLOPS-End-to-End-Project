version: "3.8"

services:

  # ── BACKEND (FastAPI + pydantic v2) ───────────────────────────
  backend:
    build: ./backend
    container_name: finpredict_backend
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MODEL_NAME=FinPredict_XGBoost
      - MODEL_STAGE=Production
    depends_on:
      - mlflow
    volumes:
      - ./data:/data
      - ./backend/logs:/logs
      - ./mlflow_data:/mlflow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - finpredict-net

  # ── FRONTEND (React) ──────────────────────────────────────────
  # ── FRONTEND (React) ──────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: finpredict_frontend
    ports:
      - "3002:3000"              # ← changed from 3000:3000
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
    - ./frontend:/app
    - /app/node_modules
    networks:
      - finpredict-net

  # ── MLFLOW ────────────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    container_name: finpredict_mlflow
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow/artifacts
    volumes:
      - ./mlflow_data:/mlflow
    networks:
      - finpredict-net

  # ── PROMETHEUS ────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: finpredict_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - finpredict-net

  # ── GRAFANA ───────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: finpredict_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - finpredict-net

  # ── AIRFLOW (pydantic v1 — separate from backend) ─────────────
  airflow:
    build: ./airflow
    container_name: finpredict_airflow
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags
      - AIRFLOW__WEBSERVER__SECRET_KEY=finpredict_secret_key_2024
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
      - GIT_PYTHON_REFRESH=quiet 
    volumes:
      - ./mlops/data_pipeline:/opt/airflow/dags
      - ./data:/data
      - ./mlflow_data:/mlflow  
    command: standalone
    networks:
      - finpredict-net

networks:
  finpredict-net:
    driver: bridge