# Backend + ML environment (FastAPI, MLflow, XGBoost)
# Use this for: running backend, training, experiments, tests
# Do NOT use for Airflow — use conda_airflow.yaml instead

name: finpredict-backend
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
    - fastapi==0.104.1
    - uvicorn==0.24.0
    - pydantic==2.4.2
    - mlflow==2.19.0
    - xgboost==2.0.1
    - scikit-learn==1.3.2
    - pandas==2.1.2
    - numpy==1.26.1
    - prometheus-client==0.18.0
    - python-dotenv==1.0.0
    - pytest==7.4.3