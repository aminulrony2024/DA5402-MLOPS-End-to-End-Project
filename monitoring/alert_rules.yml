groups:
  - name: finpredict_alerts
    rules:

      # Alert 1 — Error rate exceeds 5%
      - alert: HighErrorRate
        expr: >
          rate(finpredict_predictions_total{status="error"}[5m])
          /
          rate(finpredict_predictions_total[5m]) > 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "High prediction error rate detected"
          description: "Error rate is above 5% for the last 1 minute."

      # Alert 2 — High prediction latency
      - alert: HighLatency
        expr: >
          histogram_quantile(0.95,
            rate(finpredict_prediction_latency_seconds_bucket[5m])
          ) > 0.2
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Prediction latency above 200ms"
          description: "P95 latency has exceeded 200ms threshold."

      # Alert 3 — No predictions being made
      - alert: NoPredictions
        expr: rate(finpredict_predictions_total[5m]) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "No predictions in last 5 minutes"
          description: "The prediction endpoint has received no requests."

      # Alert 4 — Data drift detected
      - alert: DataDriftDetected
        expr: finpredict_data_drift_score > 0.1
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "Data drift detected in input features"
          description: "Input feature distribution has drifted from baseline."